(function(){'use strict';var status=document.getElementById('status');if(!window.THREE||!THREE.GLTFLoader||!THREE.OrbitControls){status.textContent='Pustaka Three.js tidak dijumpai.';return;}var cv=document.getElementById('view'),r;try{r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});}catch(e){status.textContent='WebGL tidak disokong oleh pelayar.';return;}r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.2;var scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,1,.01,100),controls=new THREE.OrbitControls(camera,cv);controls.enableDamping=true;controls.dampingFactor=.08;controls.enablePan=true;var hemi=new THREE.HemisphereLight(0xffffff,0x344155,1.6);scene.add(hemi);var a=new THREE.DirectionalLight(0xffffff,2);a.position.set(3,4,7);scene.add(a);var b=new THREE.DirectionalLight(0x9dc4ff,.9);b.position.set(-4,-2,-5);scene.add(b);var model=null,spinning=false;new THREE.GLTFLoader().load('./models/asus-z170p.glb',function(gl){model=gl.scene;scene.add(model);model.rotation.z=-Math.PI/2;model.updateMatrixWorld(true);var box=new THREE.Box3().setFromObject(model),center=new THREE.Vector3();box.getCenter(center);model.position.sub(center);model.updateMatrixWorld(true);var v=new THREE.Vector3();box.getSize(v);var size=Math.max(v.x,v.y,v.z);camera.position.set(size*.65,size*.55,size*1.9);camera.near=size*.005;camera.far=size*40;camera.updateProjectionMatrix();controls.target.set(0,0,0);controls.update();status.textContent='';},undefined,function(e){status.textContent='Gagal memuatkan model GLB. Jalankan melalui localhost / HTTP.';console.error(e);});document.getElementById('front').onclick=function(){if(model){camera.position.set(0,0,.65);controls.target.set(0,0,0);controls.update();}};document.getElementById('back').onclick=function(){if(model){camera.position.set(0,0,-.65);controls.target.set(0,0,0);controls.update();}};document.getElementById('reset
