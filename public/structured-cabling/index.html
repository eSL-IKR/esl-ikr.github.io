<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b111b">
<title>Structured Cabling 3D | eSL-IKR</title>
<meta name="description" content="Makmal pengkabelan berstruktur IKR3023, pilihan Misi 1 dan simulator terminasi kabel RJ45 3D.">
<style>
:root{color-scheme:dark;--bg:#0b111b;--line:#263746;--muted:#9ab0bc;--text:#e9f3f8;--accent:#59d9c0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);overflow:hidden}
.app{height:100dvh;min-height:340px;display:flex;flex-direction:column}
header{flex:none;min-height:68px;background:#0e1721;display:flex;gap:14px;align-items:center;padding:9px clamp(12px,2vw,24px);border-bottom:1px solid var(--line);box-shadow:0 4px 18px #0003;z-index:5}
.back{display:flex;align-items:center;justify-content:center;text-decoration:none;color:#c0d5e0;border:1px solid #385063;background:#152433;border-radius:10px;width:38px;height:38px;flex:none;font-weight:750;font-size:20px}.back:hover,.back:focus-visible{border-color:var(--accent);color:#fff}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}.brand img{width:39px;height:39px;border-radius:11px;object-fit:contain;background:#0d2032;flex:none}.brand>div{min-width:0}.brand b{font-size:13px;letter-spacing:.02em;display:block;white-space:nowrap}.brand small{color:var(--muted);font-size:10px;display:block;margin-top:2px;white-space:nowrap}
.tabs{display:flex;gap:5px;background:#0a1118;border:1px solid #2a3b48;border-radius:11px;padding:5px;min-width:0;flex:none}
.tab{border:1px solid transparent;background:none;color:#aec0cb;padding:10px 14px;border-radius:8px;font:700 12px/1.2 inherit;font-family:inherit;font-size:12px;font-weight:750;cursor:pointer;white-space:nowrap}
.tab:hover{color:#fff;background:#162838}.tab[aria-selected=true]{color:#092921;background:var(--accent);box-shadow:0 3px 14px #21cfa82e}
.tab:focus-visible{outline:2px solid #c8f3ee;outline-offset:2px}
main{position:relative;flex:1;min-height:0;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#0a111b}
#loading{pointer-events:none;position:absolute;left:50%;top:12px;transform:translateX(-50%);font-size:11px;color:#cbd9e3;border:1px solid #385063;background:#112431ed;border-radius:999px;padding:7px 13px;transition:opacity .2s;z-index:2}#loading[hidden]{display:none}
@media(max-width:720px){header{flex-wrap:wrap;row-gap:6px;min-height:0;padding:8px 11px}.brand{flex:1}.brand b{font-size:12px}.brand small{font-size:9px}.brand img{width:34px;height:34px}.back{width:34px;height:34px}.tabs{order:3;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px}.tab{font-size:11px;padding:9px 5px;min-width:0}}
@media(max-height:450px){header{min-height:48px;padding-block:4px}.brand small{display:none}}
</style>
</head>
<body>
<div class="app">
<header>
 <a class="back" href="../" title="Kembali ke portal eSL-IKR" aria-label="Kembali ke portal eSL-IKR">←</a>
 <div class="brand"><img src="../assets/structured-cabling-3d.webp" alt="Logo Structured Cabling 3D"><div><b>Structured Cabling 3D</b><small>IKR3023 · Makmal Interaktif</small></div></div>
 <nav class="tabs" aria-label="Pilih latihan Structured Cabling" role="tablist">
  <button type="button" role="tab" class="tab" id="tab-crimp" aria-selected="true" aria-controls="simulator">RJ45 · Crimp &amp; Test</button>
  <button type="button" role="tab" class="tab" id="tab-asal" aria-selected="false" aria-controls="simulator">Misi 1 · Pilih Komponen</button>
 </nav>
</header>
<main id="simulator" role="tabpanel" aria-label="Simulator Structured Cabling 3D">
 <div id="loading" aria-live="polite">Memuatkan simulator 3D…</div>
 <iframe id="lab" title="Simulator RJ45 Crimping dan Cable Tester 3D" src="./crimping-3d.html" loading="eager" allow="fullscreen" referrerpolicy="same-origin"></iframe>
</main>
</div>
<script>
(function(){
 const pages={crimp:'./crimping-3d.html',asal:'./misi-asal.html'};
 const frame=document.getElementById('lab'),msg=document.getElementById('loading');
 const buttons={crimp:document.getElementById('tab-crimp'),asal:document.getElementById('tab-asal')};
 let active='crimp';
 function change(mode, updateURL){
   if(!Object.hasOwn(pages,mode))mode='crimp';
   buttons.crimp.setAttribute('aria-selected',String(mode==='crimp'));
   buttons.asal.setAttribute('aria-selected',String(mode==='asal'));
   if(mode!==active){active=mode;msg.hidden=false;frame.src=pages[mode]}
   frame.title=mode==='crimp'?'Amali RJ45, crimper dan cable tester 3D':'Misi 1: Pilih komponen Structured Cabling 3D';
   if(updateURL){const url=new URL(location.href);if(mode==='crimp')url.searchParams.delete('latihan');else url.searchParams.set('latihan','asal');history.replaceState(null,'',url)}
 }
 frame.addEventListener('load',()=>{msg.hidden=true});
 for(const key of Object.keys(buttons))buttons[key].addEventListener('click',()=>change(key,true));
 const query=new URLSearchParams(location.search).get('latihan');if(query==='asal')change('asal',false);
 window.addEventListener('pageshow',()=>{const q=new URLSearchParams(location.search).get('latihan');if(q==='asal'&&active!=='asal')change('asal',false)});
})();
</script>
</body>
</html>
